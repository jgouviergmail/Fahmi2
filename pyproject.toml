[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fahmi2"
version = "1.3.0"
description = "Local desktop app converting pedagogical video lectures to consolidated Markdown documents."
authors = [{ name = "Fahmi2 contributors" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

dependencies = [
  "PySide6>=6.7,<7",
  "faster-whisper>=1.0,<2",
  "openai>=1.40,<2",
  "ffmpeg-python>=0.2,<0.3",
  "pywin32>=306; sys_platform == 'win32'",
  "jinja2>=3.1,<4",
  "pydantic>=2,<3",
  "python-ulid>=2,<3",
  "structlog>=24,<25",
  "tenacity>=9,<10",
  "scikit-learn>=1.5,<2",
  "genanki>=0.13,<1",
  "markdown>=3.5,<4",
  "xhtml2pdf>=0.2.17,<0.3",
  "pypdf>=4,<8",
  "python-docx>=1.1,<2",
  "htmldocx>=0.0.6,<0.1",
  "beautifulsoup4>=4.7,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-qt>=4.4",
  "responses>=0.25",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  # yt-dlp : binaire bundlé au build en prod (cf. packaging/), installé via pip
  # en dev pour que l'ingestion YouTube fonctionne (yt-dlp.exe dans le venv).
  "yt-dlp>=2024.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fahmi2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/fahmi2"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "N", "UP", "ANN", "S", "PL", "I"]
ignore = ["S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PLR2004", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
no_implicit_reexport = true
disallow_untyped_decorators = true
files = ["src/fahmi2", "tests"]

[[tool.mypy.overrides]]
module = [
  "pywin32.*",
  "win32crypt.*",
  "ffmpeg.*",
  "faster_whisper.*",
  "sklearn.*",
  "torch.*",
  "ctranslate2.*",
  "genanki.*",
  "markdown.*",
  "xhtml2pdf.*",
  "reportlab.*",
  "docx.*",
  "htmldocx.*",
  "bs4.*",
]
ignore_missing_imports = true
